<!doctype html><html lang="he"><head><meta charset="UTF-8"/><title>בחירת אנשי קשר</title><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Segoe UI",Tahoma,Arial;font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden;background:#fff;direction:ltr}.search-bar{padding:8px 10px;border-bottom:1px solid #ddd;background:#f8f8f8;flex-shrink:0}.search-bar input{width:100%;padding:6px 10px;font-size:13px;border:1px solid #ccc;border-radius:4px;direction:rtl}.main{display:flex;flex:1;overflow:hidden}.folder-tree{width:210px;min-width:140px;border-right:1px solid #ddd;overflow-y:auto;background:#fafafa;flex-shrink:0}.folder-item{padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none;border-left:3px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.folder-item:hover{background:#efefef}.folder-item.active{background:#e5f0fb;border-left-color:#0078d4;font-weight:600}.folder-icon{font-size:14px;flex-shrink:0}.folder-name{flex:1;overflow:hidden;text-overflow:ellipsis}.folder-count{color:#999;font-size:11px;flex-shrink:0}.contact-list{flex:1;overflow-y:auto}.contact-item{padding:7px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f3f3f3;cursor:pointer}.contact-item:hover{background:#f5f5f5}.contact-item.selected{background:#e5f0fb}.contact-item input[type=checkbox]{flex-shrink:0;cursor:pointer;width:15px;height:15px}.contact-info{direction:rtl;text-align:right}.contact-info .name{font-weight:600}.contact-info .email{color:#666;font-size:11px;direction:ltr;text-align:left}.empty-msg{padding:30px;text-align:center;color:#999;direction:rtl}.status-bar{padding:4px 12px;font-size:11px;color:#666;background:#f8f8f8;border-top:1px solid #eee;flex-shrink:0;direction:rtl}.footer{padding:8px 12px;border-top:1px solid #ddd;display:flex;gap:8px;flex-shrink:0}.btn{padding:7px 18px;font-size:13px;cursor:pointer;border-radius:4px;border:1px solid #ccc}.btn-primary{background:#0078d4;color:#fff;border-color:#0078d4}.btn-primary:hover{background:#006cbf}.btn-primary:disabled{background:#aaa;border-color:#aaa;cursor:default}.btn:not(.btn-primary):hover{background:#f0f0f0}#loadingMsg{padding:40px;text-align:center;color:#888;direction:rtl}</style><script defer="defer" src="polyfill.js"></script><script defer="defer" src="contactpicker.js"></script></head><body><div class="search-bar"><input id="searchBox" placeholder="חיפוש לפי שם או אימייל..."/></div><div class="main"><div class="folder-tree" id="folderTree"><div id="loadingMsg">טוען...</div></div><div class="contact-list" id="contactList"></div></div><div class="status-bar" id="statusBar">טוען נתונים...</div><div class="footer"><button class="btn btn-primary" id="btnSelect" disabled="disabled">בחר</button> <button class="btn" id="btnClose">סגור</button></div></body></html>
